<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calcolatrice grafica e laboratorio di geometria analitica per le classi terze (matematica di base).">
  <meta name="theme-color" content="#1e3a8a">
  <title>Laboratorio di Geometria Analitica — Classi Terze</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/math-exact.js"></script>
  <script defer src="js/parser.js"></script>
  <script defer src="js/geometry.js"></script>
  <script defer src="js/algebra-future.js"></script>
  <script defer src="js/exercises.js"></script>
  <script defer src="js/graph-canvas.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <header class="topbar no-print">
    <div class="brand">
      <h1>Geometria Analitica <span class="brand-sub">Terze</span></h1>
    </div>

    <div class="topbar-controls">
      <div class="segmented" role="group" aria-label="Livello classe">
        <button type="button" class="seg-btn" data-level="3F" aria-pressed="false">3F (Base)</button>
        <button type="button" class="seg-btn active" data-level="3AB" aria-pressed="true">3A / 3B (Completo)</button>
      </div>

      <div class="segmented mode-seg" role="group" aria-label="Modalità di lavoro">
        <button type="button" class="seg-btn active" data-mode="esplora" aria-pressed="true">Esplora</button>
        <button type="button" class="seg-btn" data-mode="guidato" aria-pressed="false">Guidato</button>
        <button type="button" class="seg-btn" data-mode="esercizio" aria-pressed="false">Esercizio</button>
      </div>

      <button type="button" id="btn-settings" class="icon-btn" aria-label="Impostazioni e opzioni docente" title="Opzioni">
        ⚙ Opzioni
      </button>
    </div>
  </header>

  <nav class="tool-bar no-print" aria-label="Strumenti di geometria analitica">
    <div class="tool-groups" id="tool-list"></div>
  </nav>

  <main class="workspace no-print">
    <!-- Area Grafica Isometrica -->
    <section class="graph-section" aria-label="Piano cartesiano interattivo">
      <div class="graph-toolbar">
        <div class="graph-toolbar-left">
          <button type="button" id="btn-zoom-in" class="tool-btn" aria-label="Ingrandisci" title="Ingrandisci">+</button>
          <button type="button" id="btn-zoom-out" class="tool-btn" aria-label="Rimpicciolisci" title="Rimpicciolisci">−</button>
          <button type="button" id="btn-fit" class="tool-btn" title="Inquadra la figura">Inquadra</button>
          <button type="button" id="btn-reset-view" class="tool-btn" title="Torna all'origine">Centra</button>
        </div>
        <div class="graph-toolbar-right">
          <label class="snap-label">
            Aggancio:
            <select id="snap-select" aria-label="Aggancio alla griglia">
              <option value="int">Interi (1)</option>
              <option value="half" selected>Seminteri (0,5)</option>
              <option value="none">Libero</option>
            </select>
          </label>
          <span id="coord-readout" class="coord-readout" aria-live="off">x: 0; y: 0</span>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="graph-canvas" aria-label="Piano cartesiano con unità isometriche"></canvas>
        <div id="drag-hint" class="drag-hint">Trascina i punti sul piano per aggiornare i calcoli</div>
      </div>
    </section>

    <!-- Pannello Controlli, Risultati e Passaggi -->
    <aside class="panel-section" aria-label="Controlli e risultati">
      <div class="panel-header">
        <div>
          <h2 id="tool-title">Retta per due punti</h2>
          <span id="tool-badge" class="badge hidden"></span>
        </div>
      </div>

      <div id="tool-inputs" class="card"></div>

      <div id="exercise-box" class="card hidden"></div>

      <div id="results-box" class="card"></div>

      <div id="steps-box" class="card">
        <div class="steps-header">
          <h3>Passaggi</h3>
          <div class="steps-actions" id="guided-controls"></div>
        </div>
        <ol id="steps-list" class="steps-list"></ol>
      </div>
    </aside>
  </main>

  <!-- Dialog Impostazioni & Opzioni Locali -->
  <dialog id="settings-dialog" class="modal">
    <form method="dialog" class="modal-content">
      <div class="modal-header">
        <h2>Opzioni locali</h2>
        <button type="submit" class="icon-btn" aria-label="Chiudi">✕</button>
      </div>
      <div class="modal-body">
        <p class="muted small">Nessun account, nessun dato inviato online. Le preferenze restano solo su questo dispositivo.</p>

        <label class="check-row">
          <input type="checkbox" id="opt-lim">
          <span><strong>Modalità LIM</strong> (caratteri e bottoni più grandi per la lavagna)</span>
        </label>

        <label class="check-row">
          <input type="checkbox" id="opt-teacher">
          <span><strong>Vista docente</strong> (mostra subito le soluzioni negli esercizi)</span>
        </label>

        <hr>
        <p class="small"><strong>Moduli opzionali (spenti di default, da confermare):</strong></p>

        <label class="check-row">
          <input type="checkbox" id="opt-median">
          <span>Mediana di un triangolo</span>
        </label>

        <label class="check-row">
          <input type="checkbox" id="opt-circle">
          <span>Circonferenza per tre punti</span>
        </label>

        <hr>
        <div class="modal-actions-row">
          <button type="button" id="btn-print-sheet" class="btn-secondary">🖨 Stampa scheda esercizi (senza soluzioni)</button>
          <button type="button" id="btn-clear-storage" class="btn-ghost">Cancella dati locali</button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn-primary">Chiudi</button>
      </div>
    </form>
  </dialog>

  <!-- Area di stampa dedicata: foglio esercizi per lo studente (SENZA soluzioni) -->
  <section id="print-worksheet" class="print-only" aria-hidden="true"></section>
</body>
</html>
